name = "sapphireskinclinic-cf"
compatibility_date = "2026-01-01"
pages_build_output_dir = "./dist"

# Compatibility flags for modern features
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-sensitive)
# Sensitive variables (like RESEND_API_KEY) should be set via:
# - Cloudflare Dashboard: Settings > Environment variables
# - Or: wrangler pages secret put RESEND_API_KEY

[env.production.vars]
BASE_URL = "sapphireskin.in"
R2_PUBLIC_URL = "https://pub-dd013104c4874c2abdbd26c8b454bc80.r2.dev"

[env.preview.vars]
BASE_URL = "preview.sapphireskin.in"
R2_PUBLIC_URL = "https://pub-dd013104c4874c2abdbd26c8b454bc80.r2.dev"

# Optional: If you want to bind R2 bucket directly to your worker
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "sapphireskinclinic-images"
# preview_bucket_name = "sapphireskinclinic-images-preview"
